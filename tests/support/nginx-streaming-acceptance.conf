server {
    listen 9306;

    location /api/v1/llm/chat/stream {
        proxy_pass http://host.docker.internal:9305;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
